<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics-Grounded 4D World Model Resources</title><style>body{max-width:1100px;margin:auto;padding:42px 24px;background:#111c24;color:#e7edf0;font:16px/1.7 system-ui}h1{font-size:38px;line-height:1.2}a{color:#95e3d5}article{background:#1b2b36;border:1px solid #354b59;border-radius:10px;padding:22px;margin:18px 0}small,p{color:#b4c4cd}code{overflow-wrap:anywhere}nav{display:flex;gap:24px}h2{margin-bottom:4px}</style><nav><a href="https://acse-yl222.github.io/physics-grounded-4d-world-model-framework/">Explore scenes</a><a href="resources.json">Machine-readable catalogue</a></nav><h1>Physics-Grounded 4D<br>World Model Resources</h1><p>Published geometry and simulation assets, organised by scene, resource type and version.</p><main id="resources">Loading catalogue…</main><script type="module">
const main=document.getElementById('resources');try{const response=await fetch('resources.json');if(!response.ok)throw Error(response.status);const data=await response.json();main.replaceChildren();for(const r of data.resources){const card=document.createElement('article'),heading=document.createElement('h2'),meta=document.createElement('p'),link=document.createElement('a'),license=document.createElement('small');heading.textContent=r.title;meta.textContent=`${r.scene_id} / ${r.category} / ${r.version} · ${(r.assets.reduce((sum,a)=>sum+a.bytes,0)/1e6).toFixed(1)} MB`;link.href=r.manifest||r.entry;link.textContent='Open resource manifest / entry';license.textContent=r.license;card.append(heading,meta,link,document.createElement('br'),license);main.append(card);}}catch(error){main.textContent='Unable to load catalogue: '+error.message;}
</script></html>
